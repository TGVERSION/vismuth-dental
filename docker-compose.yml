services:
  db:
    image: postgres:16
    container_name: vismuth-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vismuth_pg_data:/var/lib/postgresql/data
    networks:
      - vismuth-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vismuth-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - vismuth-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - API_MAIN_URL=${API_MAIN_URL}
        - API_ML_URL=${API_ML_URL}
    environment:
      - API_MAIN_URL=${API_MAIN_URL}
      - API_ML_URL=${API_ML_URL}
    container_name: vismuth-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - vismuth-net

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: vismuth-ml
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - "./ml-service/finetuned_autocomplete_kaggle:/app/autocomplete_model"
    networks:
      - vismuth-net

volumes:
  vismuth_pg_data:

networks:
  vismuth-net:
    driver: bridge
