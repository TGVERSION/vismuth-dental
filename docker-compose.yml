services:
  db:
    image: postgres:16
    container_name: vismuth-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vismuth_pg_data:/var/lib/postgresql/data
    networks:
      - vismuth-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vismuth-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - redis
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - vismuth-net

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vismuth-backend-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: ["python", "-m", "app.workers.ml_mkb_events_worker"]
    networks:
      - vismuth-net

  questionnaire-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vismuth-questionnaire-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: ["python", "-m", "app.workers.questionnaire_maintenance"]
    networks:
      - vismuth-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - API_MAIN_URL=${API_MAIN_URL}
        - API_ML_URL=${API_ML_URL}
        # Заглушки backend для демо-контура (frontend/src/lib/mocks.ts):
        # MOCKS=all или список через запятую. Нужна пересборка образа.
        - MOCKS=${MOCKS:-}
    environment:
      - API_MAIN_URL=${API_MAIN_URL}
      - API_ML_URL=${API_ML_URL}
    container_name: vismuth-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - vismuth-net

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: vismuth-ml
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8001:8000"
    volumes:
      - "./ml-service/autocomplete_model:/app/autocomplete_model"
      - "./ml-service/rosberta_chromadb:/app/rosberta_chromadb"
      - "./ml-service/ru-en-RoSBERTa:/app/ru-en-RoSBERTa"
      - "./ml-service/chroma_qwen_md_3/:/app/chroma_qwen_md_3"
      - "./ml-service/Qwen3-Embedding-0.6B/:/app/Qwen3-Embedding-0.6B"
    networks:
      - vismuth-net

  redis:
    image: redis:7-alpine
    container_name: vismuth-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - vismuth_redis_data:/data
    networks:
      - vismuth-net

volumes:
  vismuth_pg_data:
  vismuth_redis_data:

networks:
  vismuth-net:
    driver: bridge
