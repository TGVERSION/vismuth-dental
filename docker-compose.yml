# Порты на хосте (левая часть publish) берутся из .env:
#   FRONTEND_PORT, BACKEND_PORT, ML_SERVICE_PORT, POSTGRES_PUBLISH_PORT,
#   REDIS_PUBLISH_PORT, MINIO_API_PORT, MINIO_CONSOLE_PORT.
# Внутри docker-сети порты фиксированы (frontend 3000, backend 8000,
# ml-service 8000, postgres 5432, redis 6379) и от этих переменных не зависят.
# Значения после `:-` — умолчания, поэтому стек поднимется и без .env.
services:
  db:
    image: postgres:16
    container_name: vismuth-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - vismuth_pg_data:/var/lib/postgresql/data
    networks:
      - vismuth-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vismuth-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - redis
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - vismuth-net

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vismuth-backend-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: ["python", "-m", "app.workers.ml_mkb_events_worker"]
    networks:
      - vismuth-net

  questionnaire-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vismuth-questionnaire-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: ["python", "-m", "app.workers.questionnaire_maintenance"]
    networks:
      - vismuth-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - API_MAIN_URL=${API_MAIN_URL}
        - API_ML_URL=${API_ML_URL}
        # Заглушки backend для демо-контура (frontend/src/lib/mocks.ts):
        # MOCKS=all или список через запятую. Нужна пересборка образа.
        - MOCKS=${MOCKS:-}
    environment:
      - API_MAIN_URL=${API_MAIN_URL}
      - API_ML_URL=${API_ML_URL}
    container_name: vismuth-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - vismuth-net

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: vismuth-ml
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${ML_SERVICE_PORT:-8001}:8000"
    volumes:
      - "./ml-service/autocomplete_model:/app/autocomplete_model"
      - "./ml-service/rosberta_chromadb:/app/rosberta_chromadb"
      - "./ml-service/ru-en-RoSBERTa:/app/ru-en-RoSBERTa"
      - "./ml-service/chroma_qwen_md_3/:/app/chroma_qwen_md_3"
      - "./ml-service/Qwen3-Embedding-0.6B/:/app/Qwen3-Embedding-0.6B"
      - "./ml-service/storage:/app/storage"
    networks:
      - vismuth-net

  redis:
    image: redis:7-alpine
    container_name: vismuth-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - vismuth_redis_data:/data
    networks:
      - vismuth-net

  # Локальный S3 для PDF клинреков (ключ: guidelines/{source_id}/{version}/source.pdf).
  # Silo — S3-совместимый форк MinIO: quay.io/minio/* больше не тянется анонимно.
  # Клиент и Settings — на следующих этапах; сейчас только хранилище + бакет.
  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    container_name: vismuth-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - vismuth_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - vismuth-net

  minio-init:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    container_name: vismuth-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-vismuth-clinrec}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        # Бакет приватный: anonymous read не включаем.
        echo "bucket ready: $$S3_BUCKET"
    networks:
      - vismuth-net
    restart: "no"

volumes:
  vismuth_pg_data:
  vismuth_redis_data:
  vismuth_minio_data:

networks:
  vismuth-net:
    driver: bridge
