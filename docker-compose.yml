version: "3.9"

services:
  db:
    image: postgres:16
    container_name: vismuth-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vismuth_pg_data:/var/lib/postgresql/data
    networks:
      - vismuth-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vismuth-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - vismuth-net

volumes:
  vismuth_pg_data:

networks:
  vismuth-net:
    driver: bridge

